<!DOCTYPE html>
<html>
<head>
    <title>The View From The Voyage</title>
    <style>
        body { font-family: 'Georgia', serif; margin: 0; padding: 40px; background: #fafafa; color: #222; text-align: center; }
        header { padding: 60px 0; border-bottom: 1px solid #eee; }
        h1 { font-size: 3rem; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        p { font-style: italic; color: #666; font-size: 1.2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 300px; max-width: 1000px; margin: 60px auto; }
        .card { background: white; padding: 20px; border: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>
    <header>
        <h1>The View From The Voyage</h1>
        <p>Handpicked travel stories, style guides, and itineraries.</p>
    </header>
    <main class="grid">
        <div class="card">
            <h3>My First Voyage</h3>
            <p>Adventure awaits... Welcome to my permanent digital home.</p>
        </div>
    </main>
</body>
</html>
